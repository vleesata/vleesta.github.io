<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的个人工具箱</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700&display=swap');
        body { font-family: 'Noto Sans SC', sans-serif; }
    </style>
</head>
<body class="bg-gray-50">

    <nav class="bg-white shadow-sm border-b border-gray-100">
        <div class="max-w-5xl mx-auto px-4 h-16 flex justify-between items-center">
            <span class="text-xl font-bold text-blue-600">个人工具箱</span>
            <div class="space-x-4">
                
                <a href="about.html" class="text-sm text-gray-600 hover:text-blue-600">关于站长</a>
                <a href="update.html" class="text-sm text-gray-600 hover:text-blue-600">更新记录</a>
                
            </div>
        </div>
    </nav>

    <main class="max-w-5xl mx-auto px-4 py-12">
        <h2 class="text-2xl font-bold text-gray-800 mb-8">常用工具</h2>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">

            <a href="json_tool.html" class="block p-6 bg-white rounded-xl border border-gray-200 hover:border-blue-400 hover:shadow-md transition-all group">
            <div class="text-2xl mb-3">🛠️</div>
                <h3 class="font-bold text-gray-900 group-hover:text-blue-600 transition-colors">JSON 格式化</h3>
                <p class="text-sm text-gray-500 mt-2">将混乱的 JSON 代码一键变得整齐漂亮。</p>
            </a>

            <a href="password_gen.html" class="block p-6 bg-white rounded-xl border border-gray-200 hover:border-blue-400 hover:shadow-md transition-all group">
            <div class="text-2xl mb-3">🔑</div>
                <h3 class="font-bold text-gray-900 group-hover:text-blue-600 transition-colors">随机密码生成</h3>
                <p class="text-sm text-gray-500 mt-2">自定义长度和字符，生成高强度安全密码。</p>
            </a>

            <a href="shidu.html" class="block p-6 bg-white rounded-xl border border-gray-200 hover:border-blue-400 hover:shadow-md transition-all group">
            <div class="text-2xl mb-3">🖼️</div>
                <h3 class="font-bold text-gray-900 group-hover:text-blue-600 transition-colors">图片尺寸修改</h3>
                <p class="text-sm text-gray-500 mt-2">快速调整图片比例，适合发朋友圈或上传头像。</p>
            </a>

            <a href="text_diff.html" class="block p-6 bg-white rounded-xl border border-gray-200 hover:border-blue-400 hover:shadow-md transition-all group">
            <div class="text-2xl mb-3">📝</div>
                <h3 class="font-bold text-gray-900 group-hover:text-blue-600 transition-colors">文本对比</h3>
                <p class="text-sm text-gray-500 mt-2">找出两段文字之间的差异，支持行级对比。</p>
            </a>

            <div class="p-6 border-2 border-dashed border-gray-200 rounded-xl flex flex-col items-center justify-center text-gray-400">
                <span class="text-3xl">+</span>
                <span class="text-xs mt-2 text-center">在这里继续添加你的工具代码块...</span>
            </div>

        </div>
    </main>

    <footer class="mt-20 py-10 border-t border-gray-100 text-center">
        <p class="text-gray-400 text-xs">© 2026 个人工具站 | 基于 HTML5 纯净构建</p>
    </footer>

</body>
</html>
