<!DOCTYPE html>

<head>

    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>

        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;700&display=swap');
        body { font-family: 'Noto Sans SC', sans-serif; }
        
        /* 微调：给卡片添加一个平滑的浮起动画 */
        .tool-card { transition: transform 0.2s ease, box-shadow 0.2s ease; }
        .tool-card:hover { transform: translateY(-4px); }
    </style>
</head>
<body class="bg-gray-50 text-gray-800">

    <nav class="bg-white border-b border-gray-200 sticky top-0 z-10">
        <div class="max-w-6xl mx-auto px-4 h-16 flex justify-between items-center">
            <div class="text-xl font-bold bg-gradient-to-r from-blue-600 to-indigo-600 bg-clip-text text-transparent">
                MyTools_
            </div>
            <div class="flex space-x-6 text-sm font-medium text-gray-600">
                <a href="/" class="hover:text-blue-600">首页</a>
                <a href="https://github.com/yourname" target="_blank" class="hover:text-blue-600">GitHub</a>
                <a href="#" class="hover:text-blue-600">关于</a>
            </div>
        </div>
    </nav>

    <header class="max-w-4xl mx-auto px-4 py-16 text-center">

        <p class="text-gray-500 text-lg">这是我的个人专属工具箱，所有工具均在本地运行，保护隐私。</p>

    <main class="max-w-6xl mx-auto px-4 pb-24">
        
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            
            <a href="/tools/json-handler.html" class="tool-card block p-6 bg-white rounded-xl shadow-sm border border-gray-100 hover:shadow-lg hover:border-blue-200">
                <div class="w-12 h-12 bg-blue-50 text-blue-600 rounded-lg flex items-center justify-center mb-4">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4" />
                    </svg>
                </div>
                <h3 class="text-lg font-bold mb-2 text-gray-900">JSON 转换工具</h3>
                <p class="text-gray-500 text-sm leading-relaxed">支持 JSON 格式化、压缩以及转义，开发者的日常必备。</p>
            </a>
            <a href="/tools/image-compress.html" class="tool-card block p-6 bg-white rounded-xl shadow-sm border border-gray-100 hover:shadow-lg hover:border-green-200">
                <div class="w-12 h-12 bg-green-50 text-green-600 rounded-lg flex items-center justify-center mb-4">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
                    </svg>

                <p class="text-gray-500 text-sm leading-relaxed">纯浏览器端实现图片压缩，无需上传服务器，保护隐私。</p>
            </a>
            <a href="/tools/base64.html" class="tool-card block p-6 bg-white rounded-xl shadow-sm border border-gray-100 hover:shadow-lg hover:border-purple-200">

                    <span class="text-xl font-bold">B64</span>
                </div>

                <p class="text-gray-500 text-sm leading-relaxed">快速对文本或图片进行 Base64 编码与解码操作。</p>

            <div class="p-6 bg-gray-100 rounded-xl border-2 border-dashed border-gray-200 flex flex-col items-center justify-center text-gray-400">
                <span class="text-sm font-medium">新工具规划中...</span>

    <footer class="bg-white border-t border-gray-200 py-12">
        <div class="max-w-6xl mx-auto px-4 text-center">
